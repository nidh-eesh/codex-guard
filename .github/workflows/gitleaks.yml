name: gitleaks
on:
  pull_request: {}
  push: {}
  workflow_dispatch: {}
concurrency:
  group: gitleaks-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so don't leave the token in .git/config for later steps
          persist-credentials: false
          # Full history, so a secret committed and later deleted is still caught
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on PRs needs write access; findings still fail the job
          GITLEAKS_ENABLE_COMMENTS: false
