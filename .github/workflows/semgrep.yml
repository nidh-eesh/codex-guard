name: Semgrep OSS scan
on:
  pull_request: {}
  push:
    branches: [main, master]
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 1-7 * 6" # per-repo, staggered across month
concurrency:
  group: semgrep-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep-oss
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so don't leave the token in .git/config for later steps
          persist-credentials: false
          fetch-depth: 1
      - id: cache-semgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local
          key: semgrep-1.160.0-${{ runner.os }}
      - if: steps.cache-semgrep.outputs.cache-hit != 'true'
        run: pip install --user semgrep==1.160.0
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: semgrep scan --config=auto
